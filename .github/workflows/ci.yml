name: ci
on: [push, pull_request]

jobs:
  # 头文件必须能被纯 C 与 C++ 双向包含,且零外部依赖
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flow.h 作为纯 C11
        run: |
          printf '#include "flow.h"\nint main(void){return 0;}\n' > /tmp/c.c
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/c.c -o /tmp/c.o
      - name: C++ 算子 + ABI 布局断言
        run: |
          for f in cpp/kernels/*.cc; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c "$f" -o "/tmp/$(basename "$f").o"
          done
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c cpp/abi_assert.cc -o /tmp/a.o
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c examples/cpp/hello_world_host.cc -o /tmp/h.o
      - name: flow.hpp 糖层单元测试(异常不穿越 FFI + 构造失败安全)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude cpp/tests/flow_hpp_test.cc -o /tmp/flow_hpp_test
          /tmp/flow_hpp_test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all
      - run: cargo test --all          # 含 ABI 布局、C ABI 冒烟、内存记账、CoW 不变量
      - name: 示例必须能跑出正确结果
        run: |
          out=$(cargo run --quiet --example hello_world)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 外部宿主视角:header 声明的符号必须都在库里,且真的能链接+运行。
  # 这条曾抓到两个真问题:lmflow_register_builtin_kernels 漏在 header 之外、
  # 以及 C++ 示例忘了调它(一跑就「算子未注册」)。
  external-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: header 声明与库导出符号对齐
        run: |
          decl=$(grep -oE "^[A-Za-z_][A-Za-z0-9_ *]*\blmflow_[a-z_0-9]+\(" include/flow.h \
                 | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          syms=$(nm -g --defined-only target/release/libflow_core.a \
                 | grep -oE " T lmflow_[a-z_0-9]+" | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          missing=$(comm -23 <(echo "$decl") <(echo "$syms"))
          [ -z "$missing" ] || { echo "header 声明了但库里没有:"; echo "$missing"; exit 1; }
      - name: 编译并运行外部 C++ 宿主
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              examples/cpp/hello_world_host.cc target/release/libflow_core.a \
              -lpthread -ldl -lm -o /tmp/cpp_host
          out=$(/tmp/cpp_host)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 并发是本设计的核心风险 —— TSan 是硬门禁(见 docs/design.md §13)。
  # 排除 doctest:`-Zbuild-std` 下 rustdoc 会因 sanitizer ABI 不一致而编不过,
  # 那是工具链限制,与被测代码无关;`--lib --tests` 覆盖全部单元+集成测试。
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - name: TSan(Rust + C++ 混合,含 max_in_flight 并行路径)
        run: RUSTFLAGS="-Zsanitizer=thread" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests

  # ASan / Miri:辅助排查,暂不作门禁(build-std + C++ 侧易有误报,
  # Miri 也不完整支持线程与跨 FFI 的真实函数指针)。
  sanitizers-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src, miri }
      - name: ASan
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
        continue-on-error: true
      - name: Miri(专查 FFI 里的 unsafe)
        run: cargo +nightly miri test --lib
        continue-on-error: true

  # Python 绑定:必须真的编出来并跑通,不能只查语法
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install pybind11 numpy
      - name: 构建引擎 + pybind11 扩展
        run: python python/build.py
      - name: Python 测试套件
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: hello_world.py 输出必须正确
        run: |
          out=$(PYTHONPATH=python python examples/python/hello_world.py)
          expected=$(for i in $(seq 0 9); do echo "out: $((i*10+1)) @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }
      - name: 实时管线示例必须端到端跑通(自带断言)
        run: PYTHONPATH=python python examples/python/realtime_pipeline.py
      - run: python -m compileall -q python examples/python

  # 移动/嵌入式:引擎是可移植 Rust + cc 编的 C++,必须真能交叉编到各目标。
  # 这条门禁能抓住平台相关代码(如绑核/优先级的 cfg)在某平台编不过或漏平台。
  cross-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      # 原生 macOS:既验证 macOS 分支(QoS 优先级)能编,又让引擎真的在 macOS 上跑一遍
      - name: macOS 原生 cargo test
        run: cargo test
      # iOS:交叉编译(Xcode 自带 iOS SDK,cc 经 xcrun 编 C++ 算子)
      - name: 交叉编译到 iOS + Swift/C 桥接冒烟
        run: |
          cargo build --release --target aarch64-apple-ios
          # examples/ios 的桥接:iOS SDK 下编译+链接,证明 C ABI 头与库在 iOS 工具链可用
          # (只编+链不跑:runner 无真机;链接成功即证明头解析、符号解析、C++ 运行时可链)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 -Iinclude \
            examples/ios/bridge_smoke.c \
            target/aarch64-apple-ios/release/libflow_core.a -lc++ -o /tmp/ios_smoke
          echo "iOS 桥接编译+链接成功"

  cross-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: 交叉编译到 Android(用预装 NDK 编 C++ 算子)
        run: |
          TOOL="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang"
          export CXX_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang++"
          export AR_aarch64_linux_android="$TOOL/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOL/aarch64-linux-android21-clang"
          cargo build --target aarch64-linux-android
          # examples/android 的 JNI 桥:证明它连同引擎能被 NDK 交叉编+链成 .so
          # (JNI 符号由 App 的 JVM 在运行时提供,故 -shared 允许其未定义;引擎符号须从 .a 解析)
          "$TOOL/aarch64-linux-android21-clang++" -std=c++17 -Wall -Wextra -Werror \
            -shared -fPIC -Iinclude examples/android/jni/lmflow_jni.cc \
            target/aarch64-linux-android/debug/libflow_core.a -o /tmp/liblmflow_jni.so
          echo "Android JNI 桥交叉编+链接成功"
      # 鸿蒙/OpenHarmony 标准系统是 target_os=linux(rustc 已确认),与 Linux 走同一套代码路径,
      # 由 rust/external-host 门禁间接覆盖;其 SDK 不在 runner 上,故不单列交叉编译。

  # OpenCV 互转(flow_cv.hpp)是可选头,不进 core,但要保证它真能编、转换真对。
  opencv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cargo build --release
      - name: 编译并运行 flow_cv.hpp 测试(含非连续 ROI 拷贝)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude cpp/tests/flow_cv_test.cc \
              target/release/libflow_core.a $(pkg-config --cflags --libs opencv4) \
              -lpthread -ldl -lm -o /tmp/flow_cv_test
          /tmp/flow_cv_test
      - name: OpenCV C++ 算子在真图里端到端(测试程序链 CV 库 + flow 库;引擎本身不含 CV)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude cpp/tests/flow_cv_graph_test.cc \
              target/release/libflow_core.a $(pkg-config --cflags --libs opencv4) \
              -lpthread -ldl -lm -o /tmp/flow_cv_graph_test
          /tmp/flow_cv_graph_test
      # 直接证明「Python numpy 图 → C++ OpenCV 算子 → 读回」是同一块内存:带 --with-cv-test
      # 把 CvInvertTest 编进扩展(仅测试构建链 OpenCV;生产扩展仍零 CV),再从 Python 调用。
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install pybind11 numpy
      - name: PY numpy → C++ CV 算子(CvInvertTest)端到端
        run: |
          python python/build.py --with-cv-test
          PYTHONPATH=python python python/tests/test_cv_kernel.py -v
