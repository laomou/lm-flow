name: ci
on: [push, pull_request]

# CI is grouped into five categories (the job-name prefix is the category, so the
# GitHub Actions page groups them):
#   build          — header includability, full Rust build/test, external C++ host + symbol alignment
#   safety         — TSan (required gate), ASan/Miri (advisory)
#   bindings       — the Python extension really builds and runs
#   cross-platform — Windows / Android / macOS / iOS, guarding platform-specific code
#   integration    — optional OpenCV adapter + Python→C++ CV-kernel proof
#
# 布局:源码在 lmflow/(引擎 lmflow/core 是独立 crate),构建文件 + third_party 在仓库根。
# 各 job 用 working-directory 或显式路径落到对应目录。

jobs:
  # ================================ build & correctness ================================

  # 头文件必须能被纯 C 与 C++ 双向包含,且零外部依赖
  headers:
    name: build · headers (C/C++ includable + kernels)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v7
      - name: flow.h 作为纯 C11
        run: |
          printf '#include "lmflow/flow.h"\nint main(void){return 0;}\n' > /tmp/c.c
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/c.c -o /tmp/c.o
      - name: C++ 算子 + ABI 布局断言
        run: |
          for f in cpp/kernels/*.cc; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c "$f" -o "/tmp/$(basename "$f").o"
          done
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c cpp/abi_assert.cc -o /tmp/a.o
      - name: flow.hpp 糖层单元测试(异常不穿越 FFI + 构造失败安全)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude cpp/tests/flow_hpp_test.cc -o /tmp/flow_hpp_test
          /tmp/flow_hpp_test
      - name: buffer_util.hpp 的 F16 软件转换测试(自写实现,无编译器兜底)
        # -O0 与 -O2 都跑:浮点位操作是优化敏感的,只测一档不够。
        run: |
          for opt in -O0 -O2; do
            g++ -std=c++17 $opt -Wall -Wextra -Werror -Iinclude -Icpp/kernels \
                cpp/tests/buffer_util_test.cc -o /tmp/buffer_util_test
            /tmp/buffer_util_test
          done
      - name: flow_platform_log.hpp 可编译(桌面 stderr 分支)
        run: |
          printf '#include "lmflow/flow_platform_log.hpp"\nint main(){ lmflow::InstallPlatformLogSink(); }\n' > /tmp/plog.cc
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c /tmp/plog.cc -o /tmp/plog.o

  rust:
    name: build · rust (fmt/clippy/test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/core } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - name: 安装 Graphviz(DOT/SVG 回归)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: cargo fmt --all -- --check
      # 默认构建 = **纯 Rust 引擎**(不编任何 C++)。这就是 `cargo add lmflow` 拿到的东西,
      # 所以它是第一等公民、先跑。跑得到的测试:单元测试 + abi_layout + rust_kernel(纯 Rust 算子)。
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      - name: Rust 测试(含 Graphviz SVG 渲染)
        env: { LMFLOW_REQUIRE_GRAPHVIZ: '1' }
        run: timeout 300 cargo test
      - name: Benchmark 冒烟(实际执行,捕获运行期算子注册错误)
        run: |
          timeout 300 cargo bench --bench dispatch -- --test
          timeout 300 cargo bench --bench throughput -- --test
          timeout 300 cargo bench --bench packet -- --test
      - name: 默认构建必须真的零 C++
        run: |
          A=target/debug/liblmflow.a
          cpp=$(ar t "$A" | grep -cE 'passthrough|abi_assert|register\.o' || true)
          [ "$cpp" = 0 ] || { echo "默认构建里仍打进了 C++ 目标文件($cpp 个)"; exit 1; }
          eh=$(nm -u "$A" | grep -cE '__gxx_personality|__cxa_begin_catch|__cxa_throw' || true)
          [ "$eh" = 0 ] || { echo "默认构建里仍引用 C++ 异常运行时($eh 处)"; exit 1; }
          echo "默认构建校验通过:无 C++ 目标文件 / 无 C++ 异常运行时"
      # 守住「crate 可发布」这个性质。它极易被无声破坏:`cpp/` 与 `include/` **在 crate 目录
      # 之外**(故不随发布的 crate 分发),任何把它们挪回 crate 内、或让默认构建依赖它们的
      # 改动,都会让 `cargo publish` 失败 —— 而那原本只有真发版时才会发现。
      # dry-run 会真打包并在解包出的副本里编一遍,等价于发版前的最后一道检查。
      - name: crate 仍可发布(publish --dry-run)
        run: cargo publish --dry-run
      # 全局水位的**内存曲线**压测。此前水位只有功能测试(「撞到水位会转成背压」),
      # 没人验证过真实 RSS 是平的 —— 而「水位读数正常、内存仍单调增长」是可能的:
      # 实测把算子改成不释放包时,total_queued_bytes 依旧稳稳停在水位上,而 RSS
      # 跟着总吞吐涨了 233 MiB。这一步就是补上那个盲区。
      # 断言的是「RSS 增长受水位约束,而非受总吞吐约束」,故与规模无关(实测 250 MiB
      # 与 2.5 GiB 吞吐下增长同为 ~4.3 MiB);CI 用约 1 GiB 规模,几秒即可。
      - name: 全局水位内存曲线(soak)
        env: { LMFLOW_SOAK_PACKETS: '8000' }
        # --test-threads=1:RSS 是**进程级**读数,两条测量型测试并行会互相污染
        # (实测同进程并行时增长从 4364 KiB 虚高到 8720 KiB —— 那是对方的常驻footprint,
        # 不是泄漏)。串行后每条各自取基线、各自量增长,信号才干净。
        run: timeout 300 cargo test --test soak -- --ignored --nocapture --test-threads=1

  # 外部宿主视角:header 声明的符号必须都在库里,且最小 ABI consumer 真能链接+运行。
  external-host:
    name: build · external C++ host + symbol alignment
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cmake -S .. -B /tmp/lmflow-external -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        working-directory: lmflow
      - run: cmake --build /tmp/lmflow-external --target flow_engine lmflow_kernels_archive
        working-directory: lmflow
      - name: header 声明与库导出符号对齐
        run: |
          decl=$(grep -oE "^[A-Za-z_][A-Za-z0-9_ *]*\blmflow_[a-z_0-9]+\(" include/lmflow/flow.h \
                 | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          syms=$(nm -g --defined-only core/target/release/liblmflow.a \
                    /tmp/lmflow-external/liblmflow_kernels.a \
                 | grep -oE " T lmflow_[a-z_0-9]+" | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          missing=$(comm -23 <(echo "$decl") <(echo "$syms"))
          [ -z "$missing" ] || { echo "header 声明了但库里没有:"; echo "$missing"; exit 1; }
      - name: 编译并运行最小外部 C++ ABI consumer
        run: |
          cat >/tmp/cpp_host.cc <<'EOF'
          #include "lmflow/flow.h"
          int main() {
            if (lmflow_abi_version() != LMFLOW_ABI_VERSION) return 1;
            const char* type_name = "lmflow.test.ExternalHost";
            const uint64_t type_id = lmflow_type_id(type_name);
            if (!type_id) return 2;
            if (lmflow_register_type_descriptor(type_id, type_name, 16, 8) != LMFLOW_OK) return 3;
            if (lmflow_register_type_descriptor(type_id, type_name, 24, 8) == LMFLOW_OK) return 4;
            LMFlowGraph* graph = lmflow_graph_new();
            if (!graph) return 5;
            const char* yaml = R"(
          nodes:
            - { name: pass, kernel: PassThroughKernel, input_ports: [in], output_ports: [out] }
          input_ports: [in]
          output_ports: [out]
          )";
            const LMFlowStatus status = lmflow_graph_init_from_yaml(graph, yaml);
            lmflow_graph_free(graph);
            return status == LMFLOW_OK ? 0 : 6;
          }
          EOF
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              /tmp/cpp_host.cc -Wl,--whole-archive \
              /tmp/lmflow-external/liblmflow_kernels.a \
              -Wl,--no-whole-archive \
              core/target/release/liblmflow.a \
              -lpthread -ldl -lm -o /tmp/cpp_host
          /tmp/cpp_host

  # 用 CMake 出原生 SDK 并被消费者 find_package —— 与 cargo 并存(CMake 驱动 cargo)。
  # 根 CMakeLists 在仓库根,configure/build 都在根跑。
  cmake-sdk:
    name: build · cmake SDK (configure/build/ctest/install/find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: configure + build + ctest
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLMFLOW_BUILD_KERNELS=ON \
            -DLMFLOW_BUILD_BENCHMARKS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          test ! -e build/lmflow/adapters/opencv \
            || { echo "default build unexpectedly configured OpenCV adapter"; exit 1; }
      - name: install SDK + 最小外部工程消费(find_package)
        run: |
          cmake --install build --prefix /tmp/sdk
          test ! -e /tmp/sdk/include/lmflow/opencv.hpp \
            || { echo "default SDK unexpectedly installed OpenCV adapter"; exit 1; }
          mkdir -p /tmp/lmflow-sdk-consumer
          cat >/tmp/lmflow-sdk-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(lmflow_sdk_smoke LANGUAGES CXX)
          find_package(lmflow REQUIRED)
          add_executable(sdk_smoke main.cc)
          target_link_libraries(sdk_smoke PRIVATE lmflow::lmflow)
          EOF
          cat >/tmp/lmflow-sdk-consumer/main.cc <<'EOF'
          #include "lmflow/flow.h"
          int main() {
            LMFlowGraph* graph = lmflow_graph_new();
            if (!graph) return 1;
            const char* yaml = R"(
          nodes:
            - { name: pass, kernel: PassThroughKernel, input_ports: [in], output_ports: [out] }
          input_ports: [in]
          output_ports: [out]
          )";
            const LMFlowStatus status = lmflow_graph_init_from_yaml(graph, yaml);
            lmflow_graph_free(graph);
            return status == LMFLOW_OK ? 0 : 2;
          }
          EOF
          cmake -S /tmp/lmflow-sdk-consumer -B /tmp/ex -Dlmflow_DIR=/tmp/sdk/lib/cmake/lmflow
          cmake --build /tmp/ex
          /tmp/ex/sdk_smoke
      - name: 动态完整库 + 纯 core + kernels 关闭
        run: |
          cmake -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLMFLOW_BUILD_KERNELS=ON
          cmake --build build-shared -j
          test -f build-shared/liblmflow.so
          test -f build-shared/liblmflow_core.so
          cat >/tmp/shared_host.cc <<'EOF'
          #include "lmflow/flow.h"
          int main() {
            LMFlowGraph* graph = lmflow_graph_new();
            if (!graph) return 1;
            const char* yaml = R"(
          nodes:
            - { name: pass, kernel: PassThroughKernel, input_ports: [in], output_ports: [out] }
          input_ports: [in]
          output_ports: [out]
          )";
            const LMFlowStatus status = lmflow_graph_init_from_yaml(graph, yaml);
            lmflow_graph_free(graph);
            return status == LMFLOW_OK ? 0 : 2;
          }
          EOF
          g++ -std=c++17 -Ilmflow/include /tmp/shared_host.cc \
            -Lbuild-shared -Wl,-rpath,"$PWD/build-shared" -llmflow -o /tmp/shared_host
          /tmp/shared_host
          cmake -B build-core-only -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLMFLOW_BUILD_KERNELS=OFF
          cmake --build build-core-only -j
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: 多配置生成器下 cargo profile 必须跟随 --config
        # 守一个**静默**的坑:`CMAKE_BUILD_TYPE` 只对单配置生成器有意义,而多配置生成器
        # (Ninja Multi-Config / Visual Studio)的配置是**构建期**由 `--config` 定的。
        # 曾经的写法在配置期读该变量,于是 `--config Release` 会静默建出 dev profile 的引擎、
        # 链进 Release 宿主而**不报任何错**(实测输出 "Finished `dev` profile [unoptimized]")。
        # 直接检查生成器按配置写出的命令,不真编译,秒级。
        run: |
          cmake -B build-mc -G "Ninja Multi-Config" > /dev/null
          for cfg in Release RelWithDebInfo; do
            grep -q 'cargo build --release' "build-mc/CMakeFiles/impl-${cfg}.ninja" \
              || { echo "$cfg 下 cargo 没走 release profile"; exit 1; }
          done
          grep -q 'cargo build$' build-mc/CMakeFiles/impl-Debug.ninja \
            || { echo "Debug 下 cargo 没走 dev profile"; exit 1; }
          if grep -q 'cargo build --release' build-mc/CMakeFiles/impl-Debug.ninja; then
            echo "Debug 下 cargo 错误地带了 --release"
            exit 1
          fi
          echo "多配置生成器下 cargo profile 与 --config 一致"
  # ================================ safety (memory / concurrency) ================================

  # 并发是本设计的核心风险 —— TSan 是硬门禁(见 docs/design.md §13)。
  # 排除 doctest:`-Zbuild-std` 下 rustdoc 会因 sanitizer ABI 不一致而编不过,
  # 那是工具链限制,与被测代码无关;`--lib --tests` 覆盖全部单元+集成测试。
  tsan:
    name: safety · tsan (concurrency, required)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/core } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - name: TSan 纯 Rust core
        run: RUSTFLAGS="-Zsanitizer=thread" timeout 1200 cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests

  # ASan / Miri:辅助排查,暂不作门禁(build-std + C++ 侧易有误报,
  # Miri 也不完整支持线程与跨 FFI 的真实函数指针)。
  sanitizers-extra:
    name: safety · asan/miri (advisory)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/core } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: 'rust-src, miri' }
      - name: ASan core
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
        continue-on-error: true
      - name: Miri(专查 FFI 里的 unsafe)
        run: cargo +nightly miri test --lib
        continue-on-error: true

  # ================================ bindings ================================

  # Python 绑定:必须真的编出来并跑通,不能只查语法。
  # 走 pip install .(scikit-build-core 调根 CMake:cargo 引擎 + pybind11 扩展),
  # 与最终 wheel 完全同一条构建路径。
  python:
    name: bindings · python (pybind11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }   # third_party/pybind11
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: pip install(scikit-build-core → CMake → 引擎 + pybind11 扩展)
        run: python -m pip install -v .
      - name: Python 测试套件
        run: python -m unittest discover -s lmflow/python/tests -v
      - run: python -m compileall -q lmflow/python

  # ================================ cross-platform / mobile ================================
  # 引擎是可移植 Rust + cc 编的 C++,必须真能交叉编到各目标;这能抓住平台相关代码
  # (如绑核/优先级的 cfg)在某平台编不过或漏平台。

  cross-windows:
    name: cross-platform · windows (MSVC + SDK + Python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: 'rustfmt, clippy'
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }

      - name: 纯 Rust core
        working-directory: lmflow/core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: MSVC 独立编译 C/C++ 公共头、算子与纯头测试
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Content -Path "$env:RUNNER_TEMP\flow_header.c" -Value @'
          #include "lmflow/flow.h"
          int main(void) { return 0; }
          '@
          cl /nologo /TC /std:c11 /W4 /WX /Ilmflow/include /c `
            "$env:RUNNER_TEMP\flow_header.c" /Fo"$env:RUNNER_TEMP\flow_header.obj"

          $index = 0
          Get-ChildItem lmflow/cpp/kernels/*.cc | ForEach-Object {
            cl /nologo /TP /std:c++17 /EHsc /W4 /WX /Ilmflow/include /c $_.FullName `
              /Fo"$env:RUNNER_TEMP\kernel_$index.obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $index++
          }
          cl /nologo /TP /std:c++17 /EHsc /W4 /WX /Ilmflow/include /c `
            lmflow/cpp/abi_assert.cc /Fo"$env:RUNNER_TEMP\abi_assert.obj"
          cl /nologo /TP /std:c++17 /EHsc /W4 /WX /Ilmflow/include `
            lmflow/cpp/tests/flow_hpp_test.cc /Fe:"$env:RUNNER_TEMP\flow_hpp_test.exe"
          & "$env:RUNNER_TEMP\flow_hpp_test.exe"
          cl /nologo /TP /std:c++17 /EHsc /O2 /W4 /WX /Ilmflow/include /Ilmflow/cpp/kernels `
            lmflow/cpp/tests/buffer_util_test.cc /Fe:"$env:RUNNER_TEMP\buffer_util_test.exe"
          & "$env:RUNNER_TEMP\buffer_util_test.exe"

      - name: Visual Studio CMake 构建、测试、安装 SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build-windows -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DLMFLOW_BUILD_KERNELS=ON
          cmake --build build-windows --config Debug --parallel
          ctest --test-dir build-windows -C Debug --output-on-failure
          cmake --build build-windows --config Release --parallel
          ctest --test-dir build-windows -C Release --output-on-failure
          cmake --install build-windows --config Release --prefix "$env:RUNNER_TEMP\lmflow-sdk"
          if (-not (Test-Path "$env:RUNNER_TEMP\lmflow-sdk\lib\lmflow_core_static.lib")) {
            throw "installed SDK is missing lib/lmflow_core_static.lib"
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\lmflow-sdk\lib\lmflow_kernels.lib")) {
            throw "installed SDK is missing lib/lmflow_kernels.lib"
          }

      - name: Windows 动态完整库
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build-windows-shared -A x64 `
            -DBUILD_SHARED_LIBS=ON -DLMFLOW_BUILD_KERNELS=ON -DLMFLOW_BUILD_TESTS=OFF
          cmake --build build-windows-shared --config Release --parallel
          if (-not (Test-Path "build-windows-shared\Release\lmflow.dll")) {
            throw "shared build is missing lmflow.dll"
          }
          if (-not (Test-Path "build-windows-shared\Release\lmflow_core.dll")) {
            throw "shared build is missing lmflow_core.dll"
          }

      - name: 已安装 SDK 可被外部 MSVC 工程消费
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = "$env:RUNNER_TEMP\lmflow-sdk\lib\cmake\lmflow"
          $source = "$env:RUNNER_TEMP\sdk-consumer"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          Set-Content -Path "$source\CMakeLists.txt" -Value @'
          cmake_minimum_required(VERSION 3.18)
          project(lmflow_sdk_smoke LANGUAGES CXX)
          find_package(lmflow REQUIRED)
          add_executable(sdk_smoke main.cc)
          target_link_libraries(sdk_smoke PRIVATE lmflow::lmflow)
          '@
          Set-Content -Path "$source\main.cc" -Value @'
          #include "lmflow/flow.h"
          int main() {
            LMFlowGraph* graph = lmflow_graph_new();
            if (!graph) return 1;
            const char* yaml = R"(
          nodes:
            - { name: pass, kernel: PassThroughKernel, input_ports: [in], output_ports: [out] }
          input_ports: [in]
          output_ports: [out]
          )";
            const LMFlowStatus status = lmflow_graph_init_from_yaml(graph, yaml);
            lmflow_graph_free(graph);
            return status == LMFLOW_OK ? 0 : 2;
          }
          '@

          cmake -S $source -B "$env:RUNNER_TEMP\sdk-consumer-build" `
            -A x64 "-Dlmflow_DIR=$sdk"
          cmake --build "$env:RUNNER_TEMP\sdk-consumer-build" --config Debug --parallel
          & "$env:RUNNER_TEMP\sdk-consumer-build\Debug\sdk_smoke.exe"
          cmake --build "$env:RUNNER_TEMP\sdk-consumer-build" --config Release --parallel
          & "$env:RUNNER_TEMP\sdk-consumer-build\Release\sdk_smoke.exe"

      - name: Windows wheel 构建 + Python 测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -v .
          python -m unittest discover -s lmflow/python/tests -v
          python -m compileall -q lmflow/python

  cross-android:
    name: cross-platform · android (ndk)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: 交叉编译到 Android(用预装 NDK 编 C++ 算子)
        run: |
          TOOL="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang"
          export CXX_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang++"
          export AR_aarch64_linux_android="$TOOL/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOL/aarch64-linux-android21-clang"
          cmake -S .. -B /tmp/lmflow-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLMFLOW_BUILD_KERNELS=ON -DLMFLOW_BUILD_TESTS=OFF \
            -DLMFLOW_RUST_TARGET=aarch64-linux-android
          cmake --build /tmp/lmflow-android --parallel
      # 鸿蒙/OpenHarmony 标准系统是 target_os=linux(rustc 已确认),与 Linux 走同一套代码路径,
      # 由 rust/external-host 门禁间接覆盖;其 SDK 不在 runner 上,故不单列交叉编译。

  cross-darwin:
    name: cross-platform · macos/ios
    runs-on: macos-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      # 原生 macOS:既验证 macOS 分支(QoS 优先级)能编,又让引擎真的在 macOS 上跑一遍
      - name: macOS 原生 core 测试
        run: cargo test --manifest-path core/Cargo.toml
      # iOS:交叉编译纯 Rust core + CMake C++ kernels。
      - name: 交叉编译到 iOS
        run: |
          cmake -S .. -B /tmp/lmflow-ios \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLMFLOW_BUILD_KERNELS=ON \
            -DLMFLOW_BUILD_TESTS=OFF -DLMFLOW_RUST_TARGET=aarch64-apple-ios
          cmake --build /tmp/lmflow-ios --parallel

  # ================================ integration (OpenCV) ================================

  # OpenCV adapter 是可选组件,不进 core/默认 SDK,但要保证构建、安装、消费与转换都正确;
  # 并直证「Python numpy 图 → C++ OpenCV 算子 → 读回」是同一块内存。
  opencv:
    name: integration · opencv adapter + py→c++ cv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }   # 下面 python 部分要编 pybind11 扩展
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: 构建并测试 OpenCV adapter
        run: |
          cmake -S . -B build-opencv -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLMFLOW_BUILD_KERNELS=ON \
            -DLMFLOW_BUILD_TESTS=ON -DLMFLOW_BUILD_OPENCV_ADAPTER=ON
          cmake --build build-opencv --parallel
          ctest --test-dir build-opencv -R lmflow_opencv_test --output-on-failure
          cmake --install build-opencv --prefix /tmp/lmflow-opencv-sdk
      - name: 已安装 OpenCV component 可消费
        run: |
          mkdir -p /tmp/lmflow-opencv-consumer
          cat >/tmp/lmflow-opencv-consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(lmflow_opencv_consumer LANGUAGES CXX)
          find_package(lmflow REQUIRED COMPONENTS opencv)
          add_executable(smoke main.cc)
          target_link_libraries(smoke PRIVATE lmflow::opencv)
          EOF
          cat >/tmp/lmflow-opencv-consumer/main.cc <<'EOF'
          #include <lmflow/opencv.hpp>
          int main() {
            cv::Mat image(2, 2, CV_8UC1);
            lmflow::Packet packet = lmflow::AdoptMat(std::move(image));
            return packet.IsEmpty() ? 1 : 0;
          }
          EOF
          cmake -S /tmp/lmflow-opencv-consumer -B /tmp/lmflow-opencv-consumer-build \
            -Dlmflow_DIR=/tmp/lmflow-opencv-sdk/lib/cmake/lmflow
          cmake --build /tmp/lmflow-opencv-consumer-build
          /tmp/lmflow-opencv-consumer-build/smoke
      # 直接证明「Python numpy 图 → C++ OpenCV 算子 → 读回」是同一块内存:开 LMFLOW_WITH_CV_TEST
      # 把 CvInvertTest 编进扩展(仅测试构建链 OpenCV;生产扩展仍零 CV),再从 Python 调用。
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: PY numpy → C++ CV 算子(CvInvertTest)端到端
        run: |
          python -m pip install -v . --config-settings=cmake.define.LMFLOW_WITH_CV_TEST=ON
          python lmflow/python/tests/test_cv_kernel.py -v
