name: ci
on: [push, pull_request]

jobs:
  # 头文件必须能被纯 C 与 C++ 双向包含,且零外部依赖
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flow.h 作为纯 C11
        run: |
          printf '#include "flow.h"\nint main(void){return 0;}\n' > /tmp/c.c
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/c.c -o /tmp/c.o
      - name: C++ 算子 + ABI 布局断言
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c cpp/kernels.cc    -o /tmp/k.o
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c cpp/abi_assert.cc -o /tmp/a.o
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c examples/cpp/hello_world_host.cc -o /tmp/h.o

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all
      - run: cargo test --all          # 含 ABI 布局、C ABI 冒烟、内存记账、CoW 不变量
      - name: 示例必须能跑出正确结果
        run: |
          out=$(cargo run --quiet --example hello_world)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 外部宿主视角:header 声明的符号必须都在库里,且真的能链接+运行。
  # 这条曾抓到两个真问题:flow_register_builtin_kernels 漏在 header 之外、
  # 以及 C++ 示例忘了调它(一跑就「算子未注册」)。
  external-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: header 声明与库导出符号对齐
        run: |
          decl=$(grep -oE "^[A-Za-z_][A-Za-z0-9_ *]*\bflow_[a-z_0-9]+\(" include/flow.h \
                 | grep -oE "flow_[a-z_0-9]+" | sort -u)
          syms=$(nm -g --defined-only target/release/libflow_core.a \
                 | grep -oE " T flow_[a-z_0-9]+" | grep -oE "flow_[a-z_0-9]+" | sort -u)
          missing=$(comm -23 <(echo "$decl") <(echo "$syms"))
          [ -z "$missing" ] || { echo "header 声明了但库里没有:"; echo "$missing"; exit 1; }
      - name: 编译并运行外部 C++ 宿主
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              examples/cpp/hello_world_host.cc target/release/libflow_core.a \
              -lpthread -ldl -lm -o /tmp/cpp_host
          out=$(/tmp/cpp_host)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 并发是本设计的核心风险 —— 不做等于没验证(见 docs/design.md §13)
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src, miri }
      - name: TSan(Rust + C++ 混合)
        run: RUSTFLAGS="-Zsanitizer=thread" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
        continue-on-error: true        # M3 之前引擎尚无线程,先不作门禁
      - name: ASan
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
        continue-on-error: true
      - name: Miri(专查 FFI 里的 unsafe)
        run: cargo +nightly miri test --lib
        continue-on-error: true

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m compileall -q python examples/python
