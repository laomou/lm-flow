name: ci
on: [push, pull_request]

# CI is grouped into five categories (the job-name prefix is the category, so the
# GitHub Actions page groups them):
#   build          — header includability, full Rust build/test, external C++ host + symbol alignment
#   safety         — TSan (required gate), ASan/Miri (advisory)
#   bindings       — the Python extension really builds and runs
#   cross-platform — Android (NDK) / macOS / iOS cross-compile, guarding platform-specific code
#   integration    — optional OpenCV (flow_cv.hpp + Python→C++ CV-kernel proof)
#
# 布局:源码在 lmflow/(引擎 lmflow/flow-core 是独立 crate),构建文件 + third_party 在仓库根。
# 各 job 用 working-directory 或显式路径落到对应目录。

jobs:
  # ================================ build & correctness ================================

  # 头文件必须能被纯 C 与 C++ 双向包含,且零外部依赖
  headers:
    name: build · headers (C/C++ includable + kernels)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v4
      - name: flow.h 作为纯 C11
        run: |
          printf '#include "flow.h"\nint main(void){return 0;}\n' > /tmp/c.c
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c /tmp/c.c -o /tmp/c.o
      - name: C++ 算子 + ABI 布局断言
        run: |
          for f in cpp/kernels/*.cc; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c "$f" -o "/tmp/$(basename "$f").o"
          done
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c cpp/abi_assert.cc -o /tmp/a.o
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c examples/cpp/hello_world/hello_world_host.cc -o /tmp/h.o
      - name: flow.hpp 糖层单元测试(异常不穿越 FFI + 构造失败安全)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude cpp/tests/flow_hpp_test.cc -o /tmp/flow_hpp_test
          /tmp/flow_hpp_test
      - name: flow_platform_log.hpp 可编译(桌面 stderr 分支)
        run: |
          printf '#include "flow_platform_log.hpp"\nint main(){ lmflow::InstallPlatformLogSink(); }\n' > /tmp/plog.cc
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -c /tmp/plog.cc -o /tmp/plog.o

  rust:
    name: build · rust (fmt/clippy/test/example)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/flow-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all
      - run: timeout 600 cargo test --all   # 含 ABI 布局/C ABI/内存记账/CoW;timeout 兜底,偶发挂起也快失败而非烧满 CI
      - name: 示例必须能跑出正确结果
        run: |
          out=$(cargo run --quiet --example hello_world)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 外部宿主视角:header 声明的符号必须都在库里,且真的能链接+运行。
  # 这条曾抓到两个真问题:lmflow_register_builtin_kernels 漏在 header 之外、
  # 以及 C++ 示例忘了调它(一跑就「算子未注册」)。
  external-host:
    name: build · external C++ host + symbol alignment
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path flow-core/Cargo.toml
      - name: header 声明与库导出符号对齐
        run: |
          decl=$(grep -oE "^[A-Za-z_][A-Za-z0-9_ *]*\blmflow_[a-z_0-9]+\(" include/flow.h \
                 | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          syms=$(nm -g --defined-only flow-core/target/release/libflow_core.a \
                 | grep -oE " T lmflow_[a-z_0-9]+" | grep -oE "lmflow_[a-z_0-9]+" | sort -u)
          missing=$(comm -23 <(echo "$decl") <(echo "$syms"))
          [ -z "$missing" ] || { echo "header 声明了但库里没有:"; echo "$missing"; exit 1; }
      - name: 编译并运行外部 C++ 宿主
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
              examples/cpp/hello_world/hello_world_host.cc flow-core/target/release/libflow_core.a \
              -lpthread -ldl -lm -o /tmp/cpp_host
          out=$(/tmp/cpp_host)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }

  # 用 CMake 出原生 SDK 并被消费者 find_package —— 与 cargo 并存(CMake 驱动 cargo)。
  # 根 CMakeLists 在仓库根,configure/build 都在根跑。
  cmake-sdk:
    name: build · cmake SDK (configure/build/ctest/install/find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: configure + build + ctest
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: install SDK + 用 examples/cpp 的 CMakeLists 做消费者(find_package)
        run: |
          cmake --install build --prefix /tmp/sdk
          cmake -S lmflow/examples/cpp/hello_world -B /tmp/ex -Dlmflow_DIR=/tmp/sdk/lib/cmake/lmflow
          cmake --build /tmp/ex
          out=$(/tmp/ex/hello_world_host)
          expected=$(for i in $(seq 0 9); do echo "out: $i @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "consumer 输出不符:"; echo "$out"; exit 1; }

  # ================================ safety (memory / concurrency) ================================

  # 并发是本设计的核心风险 —— TSan 是硬门禁(见 docs/design.md §13)。
  # 排除 doctest:`-Zbuild-std` 下 rustdoc 会因 sanitizer ABI 不一致而编不过,
  # 那是工具链限制,与被测代码无关;`--lib --tests` 覆盖全部单元+集成测试。
  tsan:
    name: safety · tsan (concurrency, required)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/flow-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - name: TSan(Rust + C++ 混合,含 max_in_flight 并行路径)
        run: RUSTFLAGS="-Zsanitizer=thread" timeout 1200 cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests

  # ASan / Miri:辅助排查,暂不作门禁(build-std + C++ 侧易有误报,
  # Miri 也不完整支持线程与跨 FFI 的真实函数指针)。
  sanitizers-extra:
    name: safety · asan/miri (advisory)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow/flow-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src, miri }
      - name: ASan
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
        continue-on-error: true
      - name: Miri(专查 FFI 里的 unsafe)
        run: cargo +nightly miri test --lib
        continue-on-error: true

  # ================================ bindings ================================

  # Python 绑定:必须真的编出来并跑通,不能只查语法。
  # 走 pip install .(scikit-build-core 调根 CMake:cargo 引擎 + pybind11 扩展),
  # 与最终 wheel 完全同一条构建路径。
  python:
    name: bindings · python (pybind11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # third_party/pybind11
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: pip install(scikit-build-core → CMake → 引擎 + pybind11 扩展)
        run: python -m pip install -v .
      - name: Python 测试套件
        run: python -m unittest discover -s lmflow/python/tests -v
      - name: hello_world.py 输出必须正确
        run: |
          out=$(python lmflow/examples/python/hello_world/hello_world.py)
          expected=$(for i in $(seq 0 9); do echo "out: $((i*10+1)) @ ts=$i"; done)
          [ "$out" = "$expected" ] || { echo "输出不符:"; echo "$out"; exit 1; }
      - name: 实时管线示例必须端到端跑通(自带断言)
        run: python lmflow/examples/python/realtime_pipeline/realtime_pipeline.py
      - run: python -m compileall -q lmflow/python lmflow/examples/python

  # ================================ cross-platform / mobile ================================
  # 引擎是可移植 Rust + cc 编的 C++,必须真能交叉编到各目标;这能抓住平台相关代码
  # (如绑核/优先级的 cfg)在某平台编不过或漏平台。同时顺带编各端的集成示例桥。

  cross-android:
    name: cross-platform · android (ndk)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: 交叉编译到 Android(用预装 NDK 编 C++ 算子)
        run: |
          TOOL="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang"
          export CXX_aarch64_linux_android="$TOOL/aarch64-linux-android21-clang++"
          export AR_aarch64_linux_android="$TOOL/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOL/aarch64-linux-android21-clang"
          cargo build --target aarch64-linux-android --manifest-path flow-core/Cargo.toml
          # examples/android 的 JNI 桥:证明它连同引擎能被 NDK 交叉编+链成 .so
          # (JNI 符号由 App 的 JVM 在运行时提供,故 -shared 允许其未定义;引擎符号须从 .a 解析)
          "$TOOL/aarch64-linux-android21-clang++" -std=c++17 -Wall -Wextra -Werror \
            -shared -fPIC -Iinclude examples/android/hello_world/jni/lmflow_jni.cc \
            flow-core/target/aarch64-linux-android/debug/libflow_core.a -llog -o /tmp/liblmflow_jni.so
          echo "Android JNI 桥交叉编+链接成功"
      # 鸿蒙/OpenHarmony 标准系统是 target_os=linux(rustc 已确认),与 Linux 走同一套代码路径,
      # 由 rust/external-host 门禁间接覆盖;其 SDK 不在 runner 上,故不单列交叉编译。

  cross-darwin:
    name: cross-platform · macos/ios
    runs-on: macos-latest
    defaults: { run: { working-directory: lmflow } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      # 原生 macOS:既验证 macOS 分支(QoS 优先级)能编,又让引擎真的在 macOS 上跑一遍
      - name: macOS 原生 cargo test
        run: cargo test --manifest-path flow-core/Cargo.toml
      # iOS:交叉编译(Xcode 自带 iOS SDK,cc 经 xcrun 编 C++ 算子)
      - name: 交叉编译到 iOS + Swift/C 桥接冒烟
        run: |
          cargo build --release --target aarch64-apple-ios --manifest-path flow-core/Cargo.toml
          # examples/ios 的桥接:iOS SDK 下编译+链接,证明 C ABI 头与库在 iOS 工具链可用
          # (只编+链不跑:runner 无真机;链接成功即证明头解析、符号解析、C++ 运行时可链)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 -Iinclude \
            examples/ios/hello_world/bridge_smoke.c \
            flow-core/target/aarch64-apple-ios/release/libflow_core.a -lc++ -o /tmp/ios_smoke
          echo "iOS 桥接编译+链接成功"
      - name: Swift 示例类型检查(Demo.swift 对着 C 模块 LmFlowC)
        run: |
          # 经 module.modulemap 把 flow.h 暴露成 Swift 模块,typecheck 证明 Demo.swift 的
          # C 互操作(OpaquePointer、LMFlowPacket、状态码比较等)真的对得上 C ABI。
          swiftc -typecheck -I examples/ios/hello_world examples/ios/hello_world/Demo.swift
          echo "Demo.swift 类型检查通过"

  # ================================ integration (OpenCV) ================================

  # OpenCV 互转(flow_cv.hpp)是可选头,不进 core,但要保证它真能编、转换真对;
  # 并直证「Python numpy 图 → C++ OpenCV 算子 → 读回」是同一块内存。
  opencv:
    name: integration · opencv (flow_cv + py→c++ cv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # 下面 python 部分要编 pybind11 扩展
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cargo build --release --manifest-path lmflow/flow-core/Cargo.toml
      - name: 编译并运行 flow_cv.hpp 测试(含非连续 ROI 拷贝)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ilmflow/include lmflow/cpp/tests/flow_cv_test.cc \
              lmflow/flow-core/target/release/libflow_core.a $(pkg-config --cflags --libs opencv4) \
              -lpthread -ldl -lm -o /tmp/flow_cv_test
          /tmp/flow_cv_test
      # 直接证明「Python numpy 图 → C++ OpenCV 算子 → 读回」是同一块内存:开 LMFLOW_WITH_CV_TEST
      # 把 CvInvertTest 编进扩展(仅测试构建链 OpenCV;生产扩展仍零 CV),再从 Python 调用。
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: PY numpy → C++ CV 算子(CvInvertTest)端到端
        run: |
          python -m pip install -v . --config-settings=cmake.define.LMFLOW_WITH_CV_TEST=ON
          python lmflow/python/tests/test_cv_kernel.py -v
