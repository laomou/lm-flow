# 打 tag(v*)时产出两条发布线:
#   1. 原生 SDK —— 头文件 + 各平台编译好的库(.a/.so/.dylib),挂到 GitHub Release。
#      这是 C/C++/移动端宿主的主产物(include flow.h + 链 liblmflow)。
#   2. Python wheel —— 发布到 PyPI(pip install lm-lmflow)。**只发预编 wheel,不发 sdist**:
#      装不到匹配平台的 wheel 时 pip 直接失败,而不是在用户机上编译源码。
#
# 一次性准备(仓库管理员做一次):在 PyPI 上为 lm-lmflow 配置「可信发布者」
# (Trusted Publisher),指向本仓库的 release.yml —— 无需在仓库里存 API token。
# 见 https://docs.pypi.org/trusted-publishers/ 。之后:`git tag v0.1.0 && git push --tags`。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # 也可手动触发做一次干跑(只构建、按需发布)

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]   # macos-14=arm64;Intel-Mac(x86_64)wheel 不再单出(macos-13 runner 常年排队)
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }   # third_party/pybind11:wheel 构建要用
      # Linux 的 Rust 在 manylinux 容器内由 cibuildwheel 的 before-all 装;
      # macOS 直接在 runner 上装,给主机侧也备一份(host 工具没用到但无害)。
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建 wheel(cibuildwheel:含 Rust 引擎 + pybind11 扩展)
        uses: pypa/cibuildwheel@v4.2.0
        # 配置在 pyproject.toml 的 [tool.cibuildwheel];scikit-build-core 调根 CMake。
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # 原生 SDK:头文件 + 编译好的库(.a 静态 / .so|.dylib 动态)。
  # 这才是 C/C++/移动端宿主真正要的产物 —— 直接 include flow.h、链 liblmflow。
  native:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest, target: x86_64-unknown-linux-gnu, shared: "ON" }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu, shared: "ON" }
          - { name: macos-arm64,   os: macos-latest,  target: aarch64-apple-darwin, shared: "ON" }
          - { name: ios-arm64,     os: macos-latest,  target: aarch64-apple-ios, ios: true, shared: "OFF" }
          - { name: android-arm64, os: ubuntu-latest, target: aarch64-linux-android, ndk: true, shared: "OFF" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: 交叉工具链(按需)
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: 环境(linux-aarch64 链接器 / Android NDK)
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi
          if [ "${{ matrix.ndk }}" = "true" ]; then
            TOOL="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            echo "CC_aarch64_linux_android=$TOOL/aarch64-linux-android21-clang" >> $GITHUB_ENV
            echo "CXX_aarch64_linux_android=$TOOL/aarch64-linux-android21-clang++" >> $GITHUB_ENV
            echo "AR_aarch64_linux_android=$TOOL/llvm-ar" >> $GITHUB_ENV
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOL/aarch64-linux-android21-clang" >> $GITHUB_ENV
          fi
      - name: 配置并构建原生 SDK
        run: |
          ARGS=(
            -S .
            -B build-native
            -DCMAKE_BUILD_TYPE=Release
            -DLMFLOW_BUILD_TESTS=OFF
            -DLMFLOW_BUILD_KERNELS=ON
            -DBUILD_SHARED_LIBS=${{ matrix.shared }}
            -DLMFLOW_RUST_TARGET=${{ matrix.target }}
          )
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            ARGS+=(-DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++)
          fi
          if [ "${{ matrix.ndk }}" = "true" ]; then
            ARGS+=(
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
              -DANDROID_ABI=arm64-v8a
              -DANDROID_PLATFORM=android-21
            )
          fi
          if [ "${{ matrix.ios }}" = "true" ]; then
            ARGS+=(
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_SYSROOT=iphoneos
              -DCMAKE_OSX_ARCHITECTURES=arm64
            )
          fi
          cmake "${ARGS[@]}"
          cmake --build build-native --config Release --parallel
          cmake --install build-native --config Release --prefix sdk
      - name: 打包 SDK
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER//\//-}"
          PKG="lmflow-${VER}-${{ matrix.name }}"
          mv sdk "$PKG"
          cp LICENSE README.md "$PKG/"
          test -f "$PKG/lib/liblmflow_core.a"
          test -f "$PKG/lib/liblmflow_kernels.a"
          if [ "${{ matrix.shared }}" = "ON" ]; then
            test -f "$PKG/lib/liblmflow.so" || test -f "$PKG/lib/liblmflow.dylib"
            test -f "$PKG/lib/liblmflow_core.so" || test -f "$PKG/lib/liblmflow_core.dylib"
          fi
          tar czf "$PKG.tar.gz" "$PKG"
          ls -l "$PKG.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.name }}
          path: "*.tar.gz"

  # 打 tag 时:把原生 SDK 压缩包挂到 GitHub Release(源码 zip 由 GitHub 自动附带)。
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 创建/更新 Release 并上传资产
    steps:
      - uses: actions/download-artifact@v8
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: assets/*
          generate_release_notes: true

  publish:
    # 只有打了 tag 才真正发布;workflow_dispatch 只到构建为止(便于验证不误发)。
    # 只发 wheel(不含 sdist),从源头杜绝 pip 源码编译安装。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # 可信发布(OIDC),不用 token
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: wheels-*, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # 让发布幂等:PyPI 拒绝重复版本,若该版本已在(例如重跑本工作流、
          # 或某平台 wheel 补传)就跳过而不是让整条发布失败。
          skip-existing: true

  crates-io:
    # crates.io Trusted Publishing：在 crate 设置中信任本仓库的 release.yml，
    # GitHub Actions 通过 OIDC 换取短期 token，不保存长期 API token。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, native]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: 发布 lmflow crate
        working-directory: lmflow/core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked
