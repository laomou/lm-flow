# 生成 Python API 文档(pdoc)并发到 GitHub Pages。
# 前提(仓库管理员一次性):Settings → Pages → Source 选 "GitHub Actions"。
# 文档站:https://laomou.github.io/lm-flow/
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一个部署,新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }   # third_party/pybind11:建扩展要用
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 装 lmflow(带扩展)+ pdoc
        run: |
          python -m pip install .          # scikit-build-core:cargo 引擎 + pybind11 扩展
          python -m pip install pdoc
      - name: pdoc 生成 API 文档(内省已装的 lmflow 包)
        run: python -m pdoc lmflow -o site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
