[build-system]
requires = ["setuptools>=64", "pybind11>=2.10", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "lmflow"
version = "0.1.0"
description = "数据流图计算框架:Rust 引擎 + C ABI + C++/Python 算子"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
license = { text = "Apache-2.0" }

[project.urls]
Documentation = "https://github.com/example/lmflow/blob/main/docs/design.md"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["lmflow"]

[tool.setuptools.package-data]
lmflow = ["*.so", "*.pyd", "py.typed"]
