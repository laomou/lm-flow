[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.20"]
build-backend = "scikit_build_core.build"

[project]
# 发布名(PyPI)是 lm-lmflow;导入名仍是 lmflow(pip install lm-lmflow → import lmflow)。
# lm-flow 因去分隔符后与已存在的 lmflow 撞名被 PyPI 拒,故用 lm-lmflow。
name = "lm-lmflow"
version = "0.3.3"
description = "数据流图计算框架:Rust 引擎 + C ABI + C++/Python 算子"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
license = { text = "Apache-2.0" }
authors = [{ name = "laomou", email = "rui.mou@foxmail.com" }]
keywords = ["dataflow", "graph", "pipeline", "streaming", "rust", "pybind11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/laomou/lm-flow"
Repository = "https://github.com/laomou/lm-flow"
Documentation = "https://laomou.github.io/lm-flow/python/"

# ---- scikit-build-core:调根 CMake 出 pybind11 扩展 _lmflow(pip install / wheel 同一条路)----
# 引擎(cargo)+ C++ 算子 + 绑定都由 CMake 编;third_party/pybind11 子模块在仓库根(即项目根),
# 直接在源码内,wheel 隔离构建时不会丢。
[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
cmake.define.LMFLOW_BUILD_PYTHON = "ON"     # 让根 CMake 只编 + 装 _lmflow 扩展(不建 C++ 测试/SDK)
wheel.packages = ["lmflow/python/lmflow"]    # 纯 Python 包 lmflow/python/lmflow → wheel 的 lmflow/
build-dir = "build/{wheel_tag}"              # 按 wheel tag 分目录,避免多 Python 版本互踩

# ---- 构建 wheel 的矩阵(cibuildwheel,见 .github/workflows/release.yml)----
# 只发预编 wheel,不提供可源码编译的分发(pip 装不到匹配 wheel 时直接失败,而非本地编译)。
[tool.cibuildwheel]
# build-frontend=build → `python -m build --wheel`:直接从源码出 wheel(third_party 子模块在源码内)。
build-frontend = "build"
# 显式钉死 CPython 3.8–3.12(不随 cibuildwheel 默认版本漂移)。
build = ["cp38-*", "cp39-*", "cp310-*", "cp311-*", "cp312-*"]
# cp38-macosx_*:Python 3.8 早于 Apple Silicon,官方没有 macOS arm64 构建,
# 而 release.yml 的 mac runner 是 macos-14(arm64)。cp38 因此只出 Linux wheel。
skip = ["*-musllinux*", "pp*", "*_i686", "*-win32", "cp38-macosx_*"]
test-command = "python -c \"import lmflow; g = lmflow.Graph.from_yaml('nodes:\\n  - {kernel: PassThroughKernel, input_ports: [in], output_ports: [out]}\\ninput_ports: [in]\\noutput_ports: [out]'); g.close(); print('lm-flow OK')\""

[tool.cibuildwheel.linux]
# 在 manylinux 容器内构建:装 rustup,把 cargo 放进 PATH。auditwheel 会自动把
# 产物打成 manylinux 标签(引擎是静态库、已链进扩展,只余 glibc 内的 pthread/dl/m)。
# 固定 manylinux_2_28(glibc 2.28):比 2014(glibc 2.17)更稳当地跑 Rust 工具链,
# 仍兼容 2019 年以后的绝大多数发行版。
manylinux-x86_64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = "rustup --version || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH", MACOSX_DEPLOYMENT_TARGET = "11.0" }
