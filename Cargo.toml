[workspace]
# flow-py(pybind11 绑定)由 CMake/scikit-build 构建,不进 cargo workspace
members = ["crates/flow-core"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
flow-core = { path = "crates/flow-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
