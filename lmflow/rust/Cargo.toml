# lmflow —— 引擎的 Rust 门面 crate。
#
# 薄薄地 re-export `lmflow-core` 的公开 API,让外部 Rust 工程 `use lmflow::{Graph, Packet, ...}`
# 而不必写 `use flow_core::`。引擎实体在 `lmflow-core`(库名 flow_core = libflow_core.a,被
# C ABI / CMake / Python 共用,不改名);本 crate 只解决「引入名好看」。
#
# 外部用法:  cargo add lmflow   →   use lmflow::{Graph, Packet, Timestamp};
# (构建需 C++ 工具链 —— 引擎 lmflow-core 的 C++ 算子经 cc 链入。)
[package]
name = "lmflow"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust facade for the lmflow dataflow-graph engine (re-exports lmflow-core)"
repository = "https://github.com/laomou/lm-flow"
readme = "README.md"
keywords = ["dataflow", "graph", "pipeline", "realtime", "ffi"]
categories = ["concurrency", "multimedia"]

[dependencies]
# 本地构建走 path,发布到 crates.io 走 version(先发 lmflow-core,再发本 crate)。
lmflow-core = { version = "0.2.0", path = "../flow-core" }
