[package]
name = "lmflow"
version = "0.3.0"
description = "Dataflow-graph compute engine: a pure-Rust scheduler behind a stable C ABI"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/laomou/lm-flow"
homepage = "https://laomou.github.io/lm-flow/"
# 指向 docs.rs 而非文档站的 /rust/:crates.io 用户装的是**已发布**版本,而文档站
# 的 /rust/ 跟着 main 走(已经含 reset / on_error / rate 等尚未发布的条目)。
documentation = "https://docs.rs/lmflow"
readme = "README.md"
keywords = ["dataflow", "graph", "pipeline", "realtime", "ffi"]
categories = ["concurrency", "multimedia"]

[lib]
name = "lmflow"
# lib   : 仓库内 Rust host / 测试直接依赖(不过 FFI),外部 `use lmflow::`
# staticlib : CMake 合成纯 core 动态库与完整 lmflow 动态库的唯一原料。
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[dev-dependencies]
# 仅基准用(不进发布库/wheel)。
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dispatch"
harness = false
# 只用引擎自带的 Rust 默认算子(PassThrough / Sink)→ **不需要任何 feature**,
# 量引擎派发成本。测量口径见文件头注释。

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "packet"
harness = false

[[bench]]
name = "route_metadata"
harness = false
