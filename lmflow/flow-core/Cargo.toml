[package]
name = "lmflow-core"
version = "0.2.0"
description = "Dataflow-graph compute engine: a Rust scheduler behind a stable C ABI, with C++ kernels"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/laomou/lm-flow"
readme = "README.md"
keywords = ["dataflow", "graph", "pipeline", "realtime", "ffi"]
categories = ["concurrency", "multimedia"]
# C++ 单元测试不必进发布 tarball;cpp/kernels、cpp/abi_assert.cc、include/** 默认包含(build.rs 需要)。
exclude = ["cpp/tests/**"]

[lib]
name = "flow_core"
# lib   : 仓库内 Rust host / 测试直接依赖(不过 FFI)
# staticlib / cdylib : 供外部 C/C++ host 链接
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# 仅基准用(不进发布库/wheel)。见 benches/throughput.rs。
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false
