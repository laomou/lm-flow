[package]
name = "flow-core"
version = "0.1.0"
description = "数据流图计算框架:Rust 引擎 + C ABI 门面 + C++ 算子"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "flow_core"
# lib   : 仓库内 Rust host / 测试直接依赖(不过 FFI)
# staticlib / cdylib : 供外部 C/C++ host 链接
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# 仅基准用(不进发布库/wheel)。见 benches/throughput.rs。
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

